<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 44px; fill: #ffffff; }
    .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    
    /* Dynamic Animations */
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.8; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    @keyframes barGrow {
      0% { height: 20px; y: 220px; }
      50% { height: 70px; y: 170px; }
      100% { height: 20px; y: 220px; }
    }

    .pulse-glow { animation: pulse 4s ease-in-out infinite; }
    .animated-line { stroke-dasharray: 8, 8; animation: dash 2s linear infinite; }
    .bar-1 { animation: barGrow 4s ease-in-out infinite 0s; }
    .bar-2 { animation: barGrow 4s ease-in-out infinite 1s; }
    .bar-3 { animation: barGrow 4s ease-in-out infinite 2s; }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="800" y1="0" x2="800" y2="300"/>
    <line x1="1000" y1="0" x2="1000" y2="300"/>
  </g>

  <!-- Dynamic Wave & Connections (Right Side) -->
  <g opacity="0.4" transform="translate(650, 20)">
    <!-- Animated Chart Line -->
    <path d="M0,180 Q100,120 200,160 T400,100 T500,130" fill="none" stroke="url(#accentGrad)" stroke-width="4" filter="url(#glow)"/>
    <path d="M0,180 Q100,120 200,160 T400,100 T500,130" fill="none" stroke="#ffffff" stroke-width="2" class="animated-line"/>
    
    <!-- Animated Data Bars -->
    <rect x="250" y="170" width="16" height="50" rx="4" fill="#38bdf8" class="bar-1" opacity="0.7"/>
    <rect x="280" y="140" width="16" height="80" rx="4" fill="#818cf8" class="bar-2" opacity="0.7"/>
    <rect x="310" y="190" width="16" height="30" rx="4" fill="#c084fc" class="bar-3" opacity="0.7"/>

    <!-- Building Silhouette Vector -->
    <path d="M 350,240 L 350,80 L 420,80 L 420,240 Z M 430,240 L 430,120 L 490,120 L 490,240 Z" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <!-- Glowing Windows -->
    <circle cx="370" cy="110" r="4" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="395" cy="110" r="4" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="370" cy="140" r="4" fill="#818cf8"/>
    <circle cx="395" cy="140" r="4" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="450" cy="150" r="4" fill="#c084fc" filter="url(#glow)"/>
    <circle cx="470" cy="150" r="4" fill="#38bdf8"/>
  </g>

  <!-- Foreground Content Container -->
  <g transform="translate(60, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 45)">
      <rect width="260" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="15" y="20" class="badge-text">⚡ Building Automation &amp; AI</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="125" class="title">Awesome Building Automation Analytics 🏢✨</text>

    <!-- Gradient Divider Line -->
    <rect x="0" y="142" width="540" height="4" rx="2" fill="url(#accentGrad)"/>

    <!-- Subtitle -->
    <text x="0" y="180" class="subtitle">Fault Detection • Energy Optimization • Autonomous HVAC Controls</text>

    <!-- Subtitle Bullet Points -->
    <g transform="translate(0, 215)" font-family="Segoe UI, sans-serif" font-size="14" fill="#cbd5e1">
      <text x="0" y="0">✓ Top SaaS Platforms &amp; Open-Source Projects</text>
      <text x="310" y="0">✓ Enterprise &amp; Research Solutions</text>
    </g>
  </g>
</svg>
