<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse{0%{opacity:.3;transform:scale(.98)}50%{opacity:.8;transform:scale(1.02)}}@keyframes barGrow{0%{height:20px;y:220px}50%{height:70px;y:170px}}.badge-text,.subtitle,.title{font-family:&apos;Segoe UI&apos;,system-ui,-apple-system,sans-serif}.title{font-weight:800;font-size:44px;fill:#fff}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:14px;fill:#38bdf8}.animated-line{stroke-dasharray:8,8;animation:dash 2s linear infinite}.bar-1{animation:barGrow 4s ease-in-out infinite 0s}.bar-2{animation:barGrow 4s ease-in-out infinite 1s}.bar-3{animation:barGrow 4s ease-in-out infinite 2s}</style><rect width="1200" height="300" fill="url(#bgGrad)" rx="16"/><g stroke="#334155" stroke-width=".5" opacity=".3"><line x1="0" x2="1200" y1="60" y2="60"/><line x1="0" x2="1200" y1="120" y2="120"/><line x1="0" x2="1200" y1="180" y2="180"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="200" x2="200" y1="0" y2="300"/><line x1="400" x2="400" y1="0" y2="300"/><line x1="600" x2="600" y1="0" y2="300"/><line x1="800" x2="800" y1="0" y2="300"/><line x1="1000" x2="1000" y1="0" y2="300"/></g><g opacity=".4" transform="translate(650, 20)"><path fill="none" stroke="url(#accentGrad)" stroke-width="4" d="M0,180 Q100,120 200,160 T400,100 T500,130" filter="url